name: Render Video
on: [push, workflow_dispatch]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get install -y fonts-noto fonts-noto-extra
      - run: npm install
      - run: npx remotion browser ensure
      - run: npx remotion render src/index.ts Main out/video.mp4 --codec h264
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 7
