name: Render Video
on: [push, workflow_dispatch]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Bengali fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto fonts-noto-extra
          fc-cache -fv
      - name: Install dependencies
        run: npm install
      - name: Ensure Chromium
        run: npx remotion browser ensure
      - name: Render
        run: npx remotion render src/index.ts Main out/video.mp4 --codec h264 --crf 17
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 7
